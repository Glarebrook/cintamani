<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cintamani</title>
  <link rel="stylesheet" href="css/style.css?v=20260727-6" />
</head>
<body>
  <div id="game-wrapper">
    <div id="stats-bar">
      <span>크기 <span class="val" id="stat-size">3</span></span>
      <span>게임속도 <span class="val" id="stat-speed">100</span> ms/칸</span>
      <span>공격력 <span class="val" id="stat-attack">1</span></span>
      <span>뱀속도 <span class="val" id="stat-snake-speed">100</span> ms/칸</span>
      <span>생존 <span class="val" id="stat-time">0.0</span> s</span>
    </div>
    <canvas id="game-canvas"></canvas>
  </div>

  <script type="module" src="js/main.js?v=20260727-6"></script>
