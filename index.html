<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cintamani</title>
  <link rel="stylesheet" href="css/style.css?v=20260729-29" />
</head>
<body>
  <div id="game-wrapper">
    <div id="stats-bar">
      <span>크기 <span class="val" id="stat-size">3</span></span>
      <span>공격력 <span class="val" id="stat-attack">1</span></span>
      <span>뱀속도 <span class="val" id="stat-snake-speed">16</span> 단계</span>
      <span>생존 <span class="val" id="stat-time">0.0</span> s</span>
    </div>
    <div id="canvas-stage">
      <canvas id="game-canvas"></canvas>
      <div id="leaderboard-overlay" class="hidden">
        <div id="leaderboard-left">
          <form id="leaderboard-form">
            <div id="leaderboard-my-score"></div>
            <div>이름을 입력하세요</div>
            <input id="leaderboard-name-input" type="text" maxlength="200" autocomplete="off" placeholder="이름 (최대 200자)" />
            <div id="leaderboard-actions">
              <button type="submit">등록</button>
              <button type="button" id="leaderboard-skip-btn">건너뛰기</button>
            </div>
          </form>
          <div id="leaderboard-footer"></div>
        </div>
        <div id="leaderboard-right">
          <ol id="leaderboard-list"></ol>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="js/main.js?v=20260729-29"></script>
</body>
</html>
